name: .NET Build

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
       - 'backend/**'
       - 'frontend/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Build Backend
      - name: Restore Backend
        run: dotnet restore backend

      - name: Build Backend
        run: dotnet build backend --no-restore

      # Build Frontend
      - name: Restore Frontend
        run: dotnet restore frontend

      - name: Build Frontend
        run: dotnet build frontend --no-restore
