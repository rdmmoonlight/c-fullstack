name: Build MAUI Android APK

# Dijalankan manual saja (trigger)
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK (Java 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Wajib SDK 10 untuk net10.0-android36.0

    - name: Install MAUI Android Workload
      run: dotnet workload install maui-android

    - name: Restore Dependencies
      run: dotnet restore mobile

    - name: Build Android APK (net10.0-android36.0)
      shell: pwsh
      run: |
        dotnet publish mobile -c Release -f net10.0-android36.0 --no-restore -p:AndroidPackageFormat=apk -v:minimal -nologo 2>&1 | Tee-Object -FilePath build.log
        $code = $LASTEXITCODE
        if ($code -ne 0) {
          # Tampilkan ringkasan error sebagai annotation agar mudah dibaca
          $errs = Select-String -Path build.log -Pattern 'error' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 30
          $msg = ($errs -join "`n").Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          if ($msg.Length -gt 6000) { $msg = $msg.Substring(0,6000) }
          Write-Host "::error title=Ringkasan error build::$msg"
        }
        exit $code

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-release-apk
        path: mobile/bin/Release/net10.0-android36.0/**/*-Signed.apk
        if-no-files-found: error
