name: Build MAUI Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java JDK (Java 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install MAUI Android Workload
      run: |
        dotnet workload install maui-android

    - name: Restore Dependencies
      run: |
        dotnet restore mobile

    - name: Build Android APK (Target API 34, Min API 28)
      run: |
        dotnet publish mobile -c Release -f net8.0-android34.0 --no-restore -p:AndroidPackageFormat=apk -p:SupportedOSPlatformVersion=28.0

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maui-app-release-apk
        path: mobile/bin/Release/net8.0-android34.0/*-Signed.apk
