events { worker_connections 1024; }

http {
    upstream backend_svc {
        server backend:8080;
    }

    upstream frontend_svc {
        server frontend:80;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend_svc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend_svc/;
            proxy_set_header Host $host;
        }
    }
}
