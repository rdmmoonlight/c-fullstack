version: '3.8'

services:
  backend:
    build: ./backend-cpp
    expose:
      - "8080"
    restart: always

  frontend:
    build: ./frontend-web
    expose:
      - "80"
    restart: always

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always
