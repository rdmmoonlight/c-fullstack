events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Web root tempat hasil publish Blazor WASM diletakkan
        root /usr/share/nginx/html;
        index index.html;

        # --------------------------------------------------
        # 1. Reverse Proxy ke C# Backend (/api/)
        # --------------------------------------------------
        location /api/ {
            # Jika backend berjalan di container terpisah dalam 1 docker network:
            # proxy_pass http://backend:5000/;
            
            # Jika backend berjalan di host/port lokal yang sama:
            proxy_pass http://127.0.0.1:5000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------
        # 2. Reverse Proxy ke F# Backend (/api-fs/) - Opsional
        # --------------------------------------------------
        location /api-fs/ {
            proxy_pass http://127.0.0.1:5001/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------
        # 3. Serve Frontend Blazor WASM (SPA Routing)
        # --------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
