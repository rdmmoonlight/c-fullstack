<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C Fullstack Web</title>
</head>
<body>
    <h1>C-Powered Web Frontend</h1>
    <button onclick="fetchApi()">Call C++ Backend</button>
    <p id="output">Waiting for action...</p>

    <script>
        async function fetchApi() {
            try {
                const res = await fetch('/api/');
                const data = await res.json();
                document.getElementById('output').innerText = data.message;
            } catch (err) {
                document.getElementById('output').innerText = "Error connecting to backend";
            }
        }
    </script>
</body>
</html>
